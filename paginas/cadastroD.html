<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbra Ecclesia | Cadastro de dados</title>
    <style>
        .album-opcoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            max-width: 760px;
        }

        .album-opcao {
            position: relative;
            cursor: pointer;
        }

        .album-opcao input {
            position: absolute;
            opacity: 0;
        }

        .album-opcao img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 3px solid transparent;
            border-radius: 8px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .album-opcao span {
            display: block;
            margin-top: 6px;
            text-align: center;
        }

        .album-opcao:hover img,
        .album-opcao input:focus-visible + img,
        .album-opcao input:checked + img {
            border-color: #7c3aed;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="superior">
            <a href="index.html"><img src="../assets/logo_umbra.png" alt="logo_umbra"></a>
            <h1 class="titulo">Umbra Ecclesia</h1>
        </div>
        <div class="options">
            <div class="index">
                <a href="../paginas/index.html">Home Page</a>
            </div>
            <div class="questionario">
                <a href="../paginas/cadastroD.html">Questionario</a>
            </div>
        </div>
    </div>
    <div class="questionario">
        <label for="opt_papa">Selecione seu papa favorito</label><br><br>
        <select id="opt_papa">
            <option value="">Nihil (Papa Emeritus 0)</option>
            <option value="">Primo (Papa Emeritus I)</option>
            <option value="">Secondo (Papa Emeritus II)</option>
            <option value="">Terzo (Papa Emeritus III)</option>
            <option value="">Cardinal Copia</option>
            <option value="">Cuarto (Papa Emeritus IV)</option>
            <option value="">Perpetua (Papa Emeritus V)</option>
        </select><br><br>
        <label for="ipt_musica">Insira sua musica favorita de Ghost</label><br><br>
        <input type="text" id="ipt_musica"><br><br>
        <label>Selecione seu album favorito</label><br><br>
        <input type="hidden" id="opt_album" value="">
        <div class="album-opcoes" aria-label="Álbuns de Ghost">
            <label class="album-opcao">
                <input type="radio" name="album" value="opus">
                <img src="../assets/albuns/opus_eponimous.png" alt="Opus Eponymous">
                <span>Opus Eponymous</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="infestissuman">
                <img src="../assets/albuns/infestissuman.png" alt="Infestissumam">
                <span>Infestissumam</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="meliora">
                <img src="../assets/albuns/meliora.png" alt="Meliora">
                <span>Meliora</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="ghosts">
                <img src="../assets/albuns/ghosts.png" alt="If You Have Ghosts">
                <span>If You Have Ghosts</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="impera">
                <img src="../assets/albuns/impera.png" alt="Impera">
                <span>Impera</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="prequelle">
                <img src="../assets/albuns/prequelle.png" alt="Prequelle">
                <span>Prequelle</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="seven_inches">
                <img src="../assets/albuns/seven_inches.png" alt="Seven Inches of Satanic Panic">
                <span>Seven Inches</span>
            </label>
            <label class="album-opcao">
                <input type="radio" name="album" value="skeleta">
                <img src="../assets/albuns/skeleta.png" alt="Skeleta">
                <span>Skeleta</span>
            </label>
        </div><br>
        <label for="ipt_personagem">Insira seu personagem favorito</label><br><br>
        <input type="text" id="ipt_personagem">
    </div>
    <button onclick="cadastrar()">Cadastrar resposta</button>
</body>
</html>
<script>
    function cadastrar(){
        var papa = opt_papa.value;
        var musica = ipt_musica.value;
        var albumSelecionado = document.querySelector('input[name="album"]:checked');
        var album = albumSelecionado ? albumSelecionado.value : "";
        var personagem = ipt_personagem.value;

    // Verificando se há algum campo em branco
    if (
      papa == "" ||
      musica == "" ||
      album == "" ||
      personagem == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: papa,
        tituloServer: musica,
        senhaServer: album,
        personagemServer : personagem,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
    }
</script>
