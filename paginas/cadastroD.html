<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbra Ecclesia | Cadastro de dados</title>
</head>
<body>
    <div class="sidebar">
        <div class="superior">
            <a href="index.html"><img src="../assets/logo_umbra.png" alt="logo_umbra"></a>
            <h1 class="titulo">Umbra Ecclesia</h1>
        </div>
    </div>
    <div class="questionario">
        <label for="opt_papa">Selecione seu papa favorito</label><br><br>
        <select id="opt_papa">
            <option value="">Nihil (Papa Emeritus 0)</option>
            <option value="">Primo (Papa Emeritus I)</option>
            <option value="">Secondo (Papa Emeritus II)</option>
            <option value="">Terzo (Papa Emeritus III)</option>
            <option value="">Cardinal Copia</option>
            <option value="">Cuarto (Papa Emeritus IV)</option>
            <option value="">Perpetua (Papa Emeritus V)</option>
        </select><br><br>
        <label for="ipt_musica">Insira sua musica favorita de Ghost</label><br><br>
        <input type="text" id="ipt_musica"><br><br>
        <label for="opt_album">Selecione seu album favorito</label><br><br>
        <select id="opt_album">
            <option value="opus"><img src="../assets/albuns/opus_eponimous.png" alt="opus_eponimous"></option>
            <option value="infestissuman"><img src="../assets/albuns/infestissuman.png" alt="infestissuman"></option>
            <option value="meliora"><img src="../assets/albuns/meliora.png" alt="meliora"></option>
            <option value="ghosts"><img src="../assets/albuns/ghosts.png" alt="if_you_have_ghosts"></option>
            <option value="impera"><img src="../assets/albuns/impera.png" alt="impera"></option>
            <option value="prequelle"><img src="../assets/albuns/prequelle.png" alt="prequelle"></option>
            <option value="seven_inches"><img src="../assets/albuns/seven_inches.png" alt="seven_inches_of_satanic_panic"></option>
            <option value="skeleta"><img src="../assets/albuns/skeleta.png" alt="skeleta"></option>
        </select><br><br>
        <label for="ipt_personagem">Insira seu personagem favorito</label><br><br>
        <input type="text" id="ipt_personagem">
    </div>
    <button onclick="cadastrar()">Cadastrar resposta</button>
</body>
</html>
<script>
    function cadastrar(){
        var papa = opt_papa.value;
        var musica = ipt_musica.value;
        var album = opt_album.value;
        var personagem = ipt_personagem.value;

    // Verificando se há algum campo em branco
    if (
      papa == "" ||
      musica == "" ||
      album == "" ||
      personagem == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
    }
</script>
