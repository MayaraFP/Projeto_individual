<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Umbra Ecclesia | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="">
    <link rel="icon" href="./assets/logo_umbra.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>
<body>
    <div class="header">
      <div class="container">
        <a href="index.html"><img src="./logo_umbra.png" alt=""></a>
        <h1 class="titulo">Umbra Ecclesia</h1>
        <ul class="navbar">
          <li>
            <a href="/clero.html">O Clero</a>
          </li>
          <li>|</li>
          <li>
            <a href="/escrituras.html">As Escrituras</a>
          </li>
          <li>|</li>
          <li>
            <a href="#">Galeria</a>
          </li>
          <a href="/cadastro.html"><button class="botao-cadastro">Cadastro</button></a>
          <a href="/login.html"><button class="botao-login">Login</button></a>
        </ul>
      </div>
    </div>
    <div class="sidebannerL">
        <img src="./side_banner.png" alt="banner_fumaca">
    </div>
    <div class="sidebannerR">
        <img src="./side_banner.png" alt="banner_fumaca">
    </div>
    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-login">
                <h2>Bem-Vindo de Volta</h2>
                <h3>HE IS AND WE ARE</h3>
                <div class="formulario">
                    <div class="campo">
                        <label for="ipt_email">E-Mail</label>
                        <input id="ipt_email" type="text" placeholder="Login">
                    </div>
                    <div class="campo">
                        <label for="ipt_senha">Senha</label>
                        <input id="ipt_senha" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">CULTUI DIVINO INTERSIS</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>
</body>
</html>
<script>


    function entrar() {
        aguardar();

        var emailVar = document.getElementById("ipt_email").value;
        var senhaVar = document.getElementById("ipt_senha").value;

        if (emailVar == "" || senhaVar == "") {
            document.getElementById("cardErro").style.display = "block";
            document.getElementById("mensagem_erro").innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        document.getElementById("cardErro").style.display = "none";
    }

</script>
